[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaphunter"
version = "0.2.0"
description = "Measure detection coverage gaps: Sigma rules vs. ML anomaly detection on Sysmon logs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "GapHunter contributors" }]
keywords = ["detection-engineering", "sigma", "sysmon", "anomaly-detection", "mitre-attack", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "pyarrow>=15.0",
    "evtx>=0.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
# libvirt-python needs the libvirt headers (Arch: pacman -S libvirt).
lab = ["libvirt-python>=10.0"]
# PyTorch autoencoder backend. Without it GapHunter uses its NumPy autoencoder.
# CPU-only wheels: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
torch = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/1337strike/gaphunter"
Issues = "https://github.com/1337strike/gaphunter/issues"
Changelog = "https://github.com/1337strike/gaphunter/blob/main/CHANGELOG.md"

[project.scripts]
gaphunter = "gaphunter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gaphunter"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "docs", "lab", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Typer's API puts typer.Option(...) calls in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# long literal command strings / synthetic rows read better on one line
"src/gaphunter/baseline.py" = ["E501"]
"src/gaphunter/synth.py" = ["E501"]
"src/gaphunter/reporter.py" = ["E501"]  # inline CSS and HTML fragments
"tests/*" = ["E501"]  # real command lines and fixtures read better on one line

[tool.mypy]
strict = true
ignore_missing_imports = true
